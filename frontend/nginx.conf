# Map HTTP Connection header → WebSocket Upgrade or keep-alive
# Without this, $http_upgrade is empty for regular requests and
# the Connection header is sent as a literal "Upgrade" string.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # ── Static React App ─────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── REST API Proxy (/api/* → FastAPI :8000) ───────────────────────
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket Proxy (/ws/* → FastAPI :8000/ws/*) ─────────────────
    # IMPORTANT: proxy_read_timeout must be > 60s or nginx silently
    # kills idle WebSocket connections (default is 60s).
    location /ws/ {
        proxy_pass http://api:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # uses map above
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout  3600s;   # keep WS alive for 1 hour idle
        proxy_send_timeout  3600s;
    }
}
